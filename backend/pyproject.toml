[project]
name = "agentos-voz-backend"
version = "0.1.0"
description = "Backend modular para AgentOS Voz"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "twilio>=9.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "websockets>=15.0.0",
]

[tool.setuptools.packages.find]
# Sin esto, setuptools ve la carpeta alembic/ (migraciones de base de datos,
# no un paquete Python instalable) como "otro paquete top-level" ademas de
# app/, y se niega a instalar en modo editable ("Multiple top-level packages
# discovered"). Solo app/ es el paquete real.
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # FastAPI usa Depends/Form/Query en defaults como API publica; B008 es
    # correcto en apps generales, pero produce falsos positivos aqui.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
